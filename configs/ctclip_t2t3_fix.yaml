experiment_name: t2t3_fix_entity_blacklist_t3_grounded
projector: ctclip_stage2

# CT-CLIP feature dimensions (fixed — do not change)
ctclip_dim: 512
max_depth: 24
ctclip_tokens_per_slice: 576   # 24 * 24

# Stage 2 architecture
embed_dim: 512
num_tokens: 64          # M — default VTCB budget; override with --set for sweep
num_heads: 8
# cond_dim is the INSTRUCTION ENCODER's hidden_size, not the main LLM's —
# see configs/ctclip_stage2_llama3b_v2.yaml's comment for the full
# reasoning (unchanged here — same double-Llama setup).
cond_dim: 3072
use_film: true
dropout: 0.0

# LLM — Llama-3.2-3B-Instruct (hidden_size=3072). Unchanged from
# configs/ctclip_vfilm_fix.yaml.
llm_model_name: meta-llama/Llama-3.2-3B-Instruct
llm_frozen: false
llm_lora:
  enabled: true
  r: 16
  alpha: 32
  target_modules: ["q_proj", "v_proj"]
  dropout: 0.05

instruction_encoder_model: meta-llama/Llama-3.2-3B-Instruct

# ── T2/T3 data fix warm start ────────────────────────────────────────────
# Fixes the T2/T3 weaknesses found in docs/QUALITATIVE_EVAL_V2.md on the
# V-FiLM fix checkpoint (job 66667523): T2 cross-scan collapse (entity="lung"
# gave 1/5 distinct outputs, mean cosine 0.98 — "lung"/"chest"/"trachea" etc.
# are too generic to disambiguate scans) and T3's near-constant "No." bias
# (7/10 "accuracy" was mostly the majority-class negative default, not real
# yes/no discrimination). See aadp/data/instruction_builder.py's
# GENERIC_ENTITIES blacklist and aadp/data/ctclip_feature_dataset.py's
# _t3_positive_target() for the actual fixes — this config only changes
# data/sampling, NOT the model architecture, so unlike ctclip_vfilm_fix.yaml
# there is no warm_start_drop_keys here: gamma_v_proj (and everything else)
# should carry over normally from the already-fixed V-FiLM checkpoint.
# Optimizer/scheduler are NOT restored (weights-only warm start, same as
# every other stage-transition config in this project) — see
# scripts/train_ctclip.py's _warm_start_weights().
resume_from: /scratch/sadeniji/ictc_checkpoints_vfilm_fix/checkpoint_best.pt

# Training
device: cuda
mixed_precision: true
max_length: 1024
num_epochs: 5
# MEMORY: same double-Llama-in-fp32 setup as ctclip_vfilm_fix.yaml
# (~12.8GB x2 = ~25.7GB static weights) — proven to fit and train cleanly
# at batch_size=2, mem=80G (jobs 66527771, 66667523).
batch_size: 2
gradient_accumulation_steps: 16    # effective batch = 32
max_grad_norm: 1.0
learning_rate: 2.0e-5
weight_decay: 0.0
warmup_ratio: 0.05
warmup_steps: 500
val_every_n_steps: 500
save_every_n_steps: 1000
checkpoint_dir: /scratch/sadeniji/ictc_checkpoints_t2t3_fix
patience: 15
use_wandb: false

use_attn_loss: false

# Tasks — T4 excluded (RadGenome unavailable). T2/T3 weights bumped
# (0.3->0.35, 0.1->0.15) since both now carry better training signal
# (specific T2 entities, evidence-grounded T3 positives) than before.
tasks: ["T1", "T2", "T3"]
task_weights:
  T1: 0.5
  T2: 0.35
  T3: 0.15

# Data paths — same CT-RATE features/labels as configs/ctclip_stage2.yaml
features_train_dir: /project/def-uanazodo-ab/sadeniji/ctrate_features/train
features_valid_dir: /project/def-uanazodo-ab/sadeniji/ctrate_features/valid
ctrate_csv_train:   /project/def-uanazodo-ab/sadeniji/ctrate_csv/dataset/merged/train_merged.csv
ctrate_csv_valid:   /project/def-uanazodo-ab/sadeniji/ctrate_csv/dataset/merged/valid_merged.csv

max_samples: null
hf_token: null

# VTCB sweep values (used by scripts/vtcb_sweep_ctclip.py)
vtcb_budgets: [16, 32, 64, 128, 256, 512]
