experiment_name: ctclip_e2e_stage1
projector: ctclip_stage2

# CT-CLIP feature dimensions (fixed — do not change). Architecture-mandated
# by CTViT's checkpoint (see aadp/models/ctclip_vlm.py's _CTVIT_HPARAMS
# comment) — same (24, 576, 512) convention as the feature-based configs,
# just produced on the fly by self.visual_encoder now instead of read from
# pre-extracted .pt files.
ctclip_dim: 512
max_depth: 24
ctclip_tokens_per_slice: 576   # 24 * 24

# Stage 2 (projector) architecture
embed_dim: 512
num_tokens: 64
num_heads: 8
cond_dim: 3072   # must equal instruction_encoder_model's hidden_size — see comment below
use_film: true
dropout: 0.0

# ── End-to-end ViT staging ───────────────────────────────────────────────
# stage1: visual_encoder + llm frozen, only projector + visual_proj train.
# See CTCLIPStage2VLM.set_training_stage()/get_parameter_groups().
training_stage: stage1
ctclip_checkpoint: /project/def-uanazodo-ab/sadeniji/hf_cache/hub/datasets--ibrahimhamamci--CT-RATE/snapshots/deeca4d89e9f978d4d1bccd88a55071ddbb146bb/models/CT-CLIP-Related/CT-CLIP_v2.pt

# LLM — full fine-tuning, no LoRA for this redesign (explicit instruction:
# LoRA can be added back later). cond_dim above must match this model's
# hidden_size exactly (no instruction-encoder projection layer exists —
# see configs/ctclip_stage2_llama3b_v2.yaml's cond_dim comment, same
# constraint applies here unchanged).
llm_model_name: meta-llama/Llama-3.2-3B-Instruct
llm_frozen: false
instruction_encoder_model: meta-llama/Llama-3.2-3B-Instruct

# Training — batch size / gradient accumulation are NOT read from here for
# this path; DeepSpeed reads train_micro_batch_size_per_gpu/
# gradient_accumulation_steps directly from deepspeed_config below.
max_length: 1024
num_epochs: 5
stage1_lr: 1.0e-4
weight_decay: 0.01
val_every_n_steps: 500
save_every_n_steps: 1000
checkpoint_dir: /scratch/sadeniji/ictc_checkpoints_e2e_stage1
deepspeed_config: configs/ds_zero3.json

use_attn_loss: false

# Tasks — T4 excluded (RadGenome unavailable)
tasks: ["T1", "T2", "T3"]
task_weights:
  T1: 0.5
  T2: 0.35
  T3: 0.15

# Raw-volume data (aadp/data/ctclip_raw_dataset.py's CTRawDataset), not
# pre-extracted features — this is the point of the end-to-end redesign.
ct_volume_root: /scratch/sadeniji/ct_rate_raw
ctrate_csv_train: /project/def-uanazodo-ab/sadeniji/ctrate_csv/dataset/merged/train_merged.csv
ctrate_csv_valid: /project/def-uanazodo-ab/sadeniji/ctrate_csv/dataset/merged/valid_merged.csv
target_shape: [240, 480, 480]   # architecture-mandated, see ctclip_dim comment above

max_samples: null
hf_token: null
