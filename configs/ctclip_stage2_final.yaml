experiment_name: ctclip_stage2_final
projector: ctclip_stage2

# CT-CLIP feature dimensions (fixed — do not change)
ctclip_dim: 512
max_depth: 24
ctclip_tokens_per_slice: 576   # 24 * 24

# Stage 2 architecture
embed_dim: 512
num_tokens: 64
num_heads: 8
cond_dim: 2560
use_film: true
dropout: 0.0
# Sparse top-K cross-attention (Diagnostic Test 3 fix): CT-CLIP features are
# highly similar across spatial positions (raw pairwise cosine ~0.87), so
# full softmax over all N=D*K=13,824 keys collapses to ~mean(V) regardless
# of query, erasing FiLM's instruction-specific modulation before it can
# matter (post-fix Test 3 rerun in DIAGNOSTIC_REPORT.md). min(128, N//4)=128.
aggregator_top_k: 128

# LLM
llm_model_name: stanford-crfm/BioMedLM
llm_frozen: false
llm_lora:
  enabled: true
  r: 16
  alpha: 32
  target_modules: ["c_attn", "c_proj"]
  dropout: 0.05

instruction_encoder_model: stanford-crfm/BioMedLM

# ── Argus Section 5.1, Stage 2: full unfreeze ──────────────────────────────
# LoRA unfrozen, kept below the aggregator's LR so the aggregator (already
# trained to produce abnormality-informative tokens in Stage 1) keeps
# leading, forcing the LLM to learn to USE the now-informative visual
# tokens rather than fall back on its language prior.
#
# LRs revised after job 66352992 (aggregator=1e-3, LoRA=1e-6) collapsed
# into 100% NaN loss from step 2950 onward: 1e-3 on the aggregator under
# the combined lm_loss + cls_loss_weight*cls_loss objective is suspected to
# have caused early gradient explosion, while 1e-6 on LoRA was too small to
# meaningfully adapt in the ~500 steps completed before the run died. Now:
# aggregator=2e-4 (was 1e-3), LoRA=1e-5 (was 1e-6), max_grad_norm=0.5 (was
# 1.0), cls_loss_weight=0.1 (was 0.3, to reduce dual-loss instability while
# lm_loss is still large early on). Unverified — gated behind the Change 6
# smoke test (configs/narval_smoke_stage2.yaml) before any full run.
stage: 2
num_labels: 18   # asserted against the dataset's detected label columns
resume_from: /scratch/sadeniji/ictc_checkpoints_stage1/checkpoint_best.pt

# Training
device: cuda
mixed_precision: true
# CT-RATE reports avg ~201 tokens, max ~824 (verified against
# train_merged.csv) — 256 was silently truncating most reports. Argus
# Appendix B uses 1024.
max_length: 1024
num_epochs: 3
batch_size: 1                      # down from 2 — 1024-token sequences need more activation memory
gradient_accumulation_steps: 32    # up from 16 — keeps effective batch = 32
max_grad_norm: 0.5                 # down from 1.0 — tighter clip after job 66352992's NaN collapse
aggregator_learning_rate: 2.0e-4   # down from 1e-3 — suspected gradient-explosion source (dual LM+BCE loss)
learning_rate: 1.0e-5               # up from 1e-6 — was too small to adapt in ~500 steps before the run died
cls_loss_weight: 0.1                # down from 0.3 — reduces dual-loss instability while LM loss is still large
weight_decay: 0.0
warmup_ratio: 0.05
warmup_steps: 500
val_every_n_steps: 500
save_every_n_steps: 1000
checkpoint_dir: /scratch/sadeniji/ictc_checkpoints_stage2_final
patience: 15
use_wandb: false

use_attn_loss: false

tasks: ["T1", "T2", "T3"]
task_weights:
  T1: 0.6
  T2: 0.3
  T3: 0.1

# Data paths
features_train_dir: /project/def-uanazodo-ab/sadeniji/ctrate_features/train
features_valid_dir: /project/def-uanazodo-ab/sadeniji/ctrate_features/valid
ctrate_csv_train:   /project/def-uanazodo-ab/sadeniji/ctrate_csv/dataset/merged/train_merged.csv
ctrate_csv_valid:   /project/def-uanazodo-ab/sadeniji/ctrate_csv/dataset/merged/valid_merged.csv

max_samples: null
hf_token: null

# VTCB sweep values (used by scripts/vtcb_sweep_ctclip.py)
vtcb_budgets: [16, 32, 64, 128, 256, 512]
