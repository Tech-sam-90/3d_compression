experiment_name: narval_smoke_llama3b
projector: ctclip_stage2

ctclip_dim: 512
max_depth: 24
ctclip_tokens_per_slice: 576

embed_dim: 512
num_tokens: 64
num_heads: 8
# See configs/ctclip_stage2_llama3b.yaml — cond_dim must equal
# instruction_encoder_model's hidden_size exactly (no projection layer).
cond_dim: 3072
use_film: true
dropout: 0.0

llm_model_name: meta-llama/Llama-3.2-3B-Instruct
llm_frozen: false
llm_lora:
  enabled: true
  r: 16
  alpha: 32
  target_modules: ["q_proj", "v_proj"]
  dropout: 0.05
instruction_encoder_model: meta-llama/Llama-3.2-3B-Instruct

device: cuda
mixed_precision: true
num_epochs: 1
batch_size: 2
# gradient_accumulation_steps dropped from the parent's 16 to 1: with only
# 20 samples / batch_size=2 = 10 batches, grad_accum=16 would never
# complete one accumulation window, so zero optimizer steps would ever
# fire — same issue hit and fixed for smoke_test_biomedlm.sh.
gradient_accumulation_steps: 1
max_grad_norm: 1.0
learning_rate: 2.0e-5
weight_decay: 0.0
# warmup_ratio auto-scales to this run's tiny step count (see
# scripts/train_ctclip.py's scheduler setup) — no manual warmup_steps
# override needed.
warmup_ratio: 0.05
val_every_n_steps: 5
save_every_n_steps: 10
checkpoint_dir: /scratch/sadeniji/smoke_checkpoints_llama3b
patience: 99
use_wandb: false
use_attn_loss: false

tasks: ["T1", "T2", "T3"]
task_weights:
  T1: 0.6
  T2: 0.3
  T3: 0.1

features_train_dir: /project/def-uanazodo-ab/sadeniji/ctrate_features/train
features_valid_dir: /project/def-uanazodo-ab/sadeniji/ctrate_features/valid
ctrate_csv_train: /project/def-uanazodo-ab/sadeniji/ctrate_csv/dataset/merged/train_merged.csv
ctrate_csv_valid: /project/def-uanazodo-ab/sadeniji/ctrate_csv/dataset/merged/valid_merged.csv
max_samples: 20
hf_token: null
vtcb_budgets: [16, 32, 64]
