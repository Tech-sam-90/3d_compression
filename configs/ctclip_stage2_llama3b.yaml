experiment_name: ctclip_stage2_llama3b_biomedbert
projector: ctclip_stage2

# CT-CLIP feature dimensions (fixed — do not change)
ctclip_dim: 512
max_depth: 24
ctclip_tokens_per_slice: 576   # 24 * 24

# Stage 2 architecture
embed_dim: 512
num_tokens: 64          # M — default VTCB budget; override with --set for sweep
num_heads: 8
# cond_dim is the INSTRUCTION ENCODER's hidden_size, not the main LLM's —
# aadp/models/ctclip_vlm.py asserts cond_dim == instruction_encoder.output_dim
# with no projection layer in between (self.llm.config.hidden_size is read
# separately and only feeds visual_proj). instruction_encoder_model below
# is now microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract
# (hidden_size=768), not Llama — see instruction_encoder_model comment.
cond_dim: 768
use_film: true
dropout: 0.0

# LLM — Llama-3.2-3B-Instruct (hidden_size=3072), matching Argus's
# architecture family, to compare against the BioMedLM (GPT-2, 2560) run in
# configs/ctclip_stage2.yaml.
llm_model_name: meta-llama/Llama-3.2-3B-Instruct
llm_frozen: false
llm_lora:
  enabled: true
  r: 16
  alpha: 32
  # Llama uses separate Q/K/V/O projections (q_proj/k_proj/v_proj/o_proj),
  # not GPT-2's fused c_attn — q_proj/v_proj is the correct, standard LoRA
  # target for this architecture family (same as narval_smoke.yaml's
  # facebook/opt-125m, which shares the separate-projection convention).
  target_modules: ["q_proj", "v_proj"]
  dropout: 0.05

# Instruction encoder — small frozen BiomedBERT (110M) instead of a second
# Llama-3.2-3B-Instruct load. The two prior full runs (ictc_checkpoints_llama3b_v2,
# ictc_checkpoints_llama3b_attention_cond) both double-loaded Llama as both
# the LLM and the instruction encoder (~25.7GB static fp32 weights alone,
# flagged as a "MEMORY RISK" when this config was first written) — this
# swaps the instruction-encoder half for a purpose-built biomedical text
# encoder at 1/28th the parameter count, still frozen and still producing
# genuine contextualized embeddings (mean-pooled last_hidden_state, same
# InstructionEncoder class/mechanism as every other encoder this project has
# used — nothing about the conditioning mechanism itself changes). No
# projection layer: cond_dim above is set to BiomedBERT's native 768.
instruction_encoder_model: microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract

# Training
device: cuda
mixed_precision: true
# CT-RATE reports avg ~201 tokens, max ~824 — 256 was silently truncating
# most reports. Argus Appendix B uses 1024.
max_length: 1024
num_epochs: 5
# MEMORY: previously this loaded Llama-3.2-3B-Instruct TWICE (main LLM +
# instruction encoder, ~25.7GB static fp32 weights alone — see
# instruction_encoder_model comment above for the fix). Now only the main
# LLM (~12.8GB) plus a 110M-param frozen BiomedBERT (~0.4GB) load — batch
# size kept the same as the prior successful full runs since headroom only
# increased.
batch_size: 2
gradient_accumulation_steps: 16    # effective batch = 32
max_grad_norm: 1.0
learning_rate: 2.0e-5
weight_decay: 0.0
warmup_ratio: 0.05
warmup_steps: 500
val_every_n_steps: 500
save_every_n_steps: 1000
# New directory (not ictc_checkpoints_llama3b_v2) so the just-completed
# Llama+FiLM run (best val_loss=0.4225, best Test 3 collapse rate 6.7% of
# any checkpoint this session) is preserved rather than overwritten by this
# BiomedBERT-instruction-encoder variant. No resume_from, matching how both
# prior Llama runs also trained from scratch.
checkpoint_dir: /scratch/sadeniji/ictc_checkpoints_llama3b_biomedbert
patience: 15
use_wandb: false


use_attn_loss: false

# Tasks — T4 excluded (RadGenome unavailable)
tasks: ["T1", "T2", "T3"]
task_weights:
  T1: 0.6
  T2: 0.3
  T3: 0.1

# Data paths — same CT-RATE features/labels as configs/ctclip_stage2.yaml
features_train_dir: /project/def-uanazodo-ab/sadeniji/ctrate_features/train
features_valid_dir: /project/def-uanazodo-ab/sadeniji/ctrate_features/valid
ctrate_csv_train:   /project/def-uanazodo-ab/sadeniji/ctrate_csv/dataset/merged/train_merged.csv
ctrate_csv_valid:   /project/def-uanazodo-ab/sadeniji/ctrate_csv/dataset/merged/valid_merged.csv

max_samples: null
hf_token: null

# VTCB sweep values (used by scripts/vtcb_sweep_ctclip.py)
vtcb_budgets: [16, 32, 64, 128, 256, 512]
